server {
    listen 80;

    # Serve React build files
    root /usr/share/nginx/html;
    index index.html;

    # Serve SPA routes by falling back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Fallback to index.html for 404 errors
    error_page 404 /index.html;
}
